<nav class="sticky top-0 z-50 glass shadow-lg border-b border-white/30">
  <div class="max-w-7xl mx-auto px-4">
    <div class="h-16 flex items-center justify-between">
      <a
        routerLink="/home"
        class="flex items-center gap-2">
        <span class="text-2xl">🍩</span>
        <span class="font-Simpsonfont simpsons-title
        text-2xl sm:text-3xl
        font-bold select-none">
          The Simpsons
        </span>
      </a>
      <div class="hidden sm:flex items-center gap-1">
        @for (ruta of rutas; track ruta) {
          <a routerLink="{{ruta.path}}"
             routerLinkActive="bg-yellow-300/80 text-blue-900"
             class=
               "px-3 py-2 rounded-md text-blue-900
               hover:bg-yellow-200 hover:text-blue-900
               font-semibold transition">
            {{ ruta.titulo }}
          </a>
        }
      </div>
      <button
        (click)="toggleMenu()"
        class="sm:hidden p-2 rounded-md text-blue-900 hover:bg-yellow-200 transition">
        <span class="text-xl">{{ isMenuOpen() ? '✖' : '☰' }}</span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  @if (isMenuOpen()) {
    <div class="sm:hidden bg-white/95 backdrop-blur shadow-lg border-t border-white/30">
      <div class="max-w-7xl mx-auto px-4 py-4">
        <div class="flex flex-col gap-2">
          @for (ruta of rutas; track ruta) {
            <a
              routerLink="{{ruta.path}}"
              routerLinkActive="bg-yellow-300/80 text-blue-900"
              (click)="closeMenu()"
              class="flex items-center gap-3 px-4 py-3 rounded-lg text-blue-900
                     hover:bg-yellow-200 hover:text-blue-900
                     font-semibold transition">
              <span class="text-lg">{{ ruta.icono }}</span>
              <div>
                <div>{{ ruta.titulo }}</div>
                @if (ruta.descripcion) {
                  <div class="text-sm text-blue-700/70">{{ ruta.descripcion }}</div>
                }
              </div>
            </a>
          }
        </div>
        <div class="mt-4 pt-4 border-t border-blue-200/50">
          <div class="flex justify-center gap-2">
            <span class="px-3 py-1 bg-yellow-300/70 rounded-full text-blue-900 font-semibold text-sm">D'oh!</span>
            <span class="px-3 py-1 bg-pink-300/70 rounded-full text-blue-900 font-semibold text-sm">¡Ay, caramba!</span>
            <span class="px-3 py-1 bg-sky-300/70 rounded-full text-blue-900 font-semibold text-sm">Woo-hoo!</span>
          </div>
        </div>
      </div>
    </div>
  }
